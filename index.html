<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Andrija — Studio</title>

    <meta name="description" content="Creative design portfolio">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;900&display=swap" rel="stylesheet">


    <!-- Styles -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/animations.css">

</head>


<body>


    <!-- Custom Cursor -->
    <div class="cursor">
        <span></span>
    </div>



    <!-- Navigation -->

    <header class="nav">

        <a class="logo" href="/">
            A.
        </a>


        <button class="index-button">
            Index
        </button>

    </header>




    <!-- Main Experience -->

    <main class="experience">


        <!-- Intro -->

        <section class="intro">


            <div class="intro-dot"></div>


            <h1 class="hidden">
                Andrija
            </h1>


        </section>





        <!-- Project Canvas -->


        <section class="gallery">


            <article class="project project-one">

                <div class="project-image">

                    <img 
                    src="images/project-01.jpg"
                    alt="Project one">

                </div>

            </article>





            <article class="project project-two">

                <div class="project-image">

                    <img 
                    src="images/project-02.jpg"
                    alt="Project two">

                </div>

            </article>





            <article class="project project-three">

                <div class="project-image">

                    <img 
                    src="images/project-03.jpg"
                    alt="Project three">

                </div>

            </article>






            <article class="project project-four">

                <div class="project-image">

                    <img 
                    src="images/project-04.jpg"
                    alt="Project four">

                </div>

            </article>





            <article class="project project-five">

                <div class="project-image">

                    <img 
                    src="images/project-05.jpg"
                    alt="Project five">

                </div>

            </article>


        </section>






        <!-- Project Overlay -->

        <div class="project-view">

            <button class="close-project">
                Close
            </button>


            <div class="project-content">

                <img src="" alt="">

            </div>


        </div>





    </main>







    <!-- Scripts -->

    <script src="js/app.js"></script>

</body>


</html>
